<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Night Vision | Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: #10162f;
      --text: #f5f7ff;
      --muted: #9ca6c1;
      --accent: #4aa6ff;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #162147 0%, var(--bg) 58%);
      color: var(--text);
      font-family: "Figtree", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1.5rem;
    }
    main {
      width: min(32rem, 100%);
      background: color-mix(in srgb, var(--panel), black 16%);
      border: 1px solid color-mix(in srgb, var(--accent), transparent 70%);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Project Night Vision is not reachable right now. Reconnect to keep exploring your dream archive.</p>
  </main>
</body>
</html>
